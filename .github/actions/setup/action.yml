name: Setup
description: Enable pnpm, set up Node with the pnpm store cache, and install dependencies. Run actions/checkout first.

runs:
  using: composite
  steps:
    # corepack reads the pinned pnpm version from package.json (packageManager).
    - name: Enable pnpm
      shell: bash
      run: corepack enable

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
